[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sueno"
version = "1.0.0"
description = "Clasificación automática de los estadios del sueño con canales variables (Sleep-EDF)"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.5",
    "pandas==2.3.2",
    "scipy==1.17.1",
    "scikit-learn==1.7.1",
    "xgboost==3.0.5",
    "mne==1.12.1",
    "antropy==0.2.2",
    "PyWavelets==1.8.0",
    "torch==2.5.1",
    "joblib==1.5.1",
    "pyarrow==22.0.0",
    "xlrd==2.0.2",
    "matplotlib==3.10.5",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
