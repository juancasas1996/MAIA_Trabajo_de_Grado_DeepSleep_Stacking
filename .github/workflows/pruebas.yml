# Pruebas del sistema con el modelo de modelo/. Las corren el E2E (en cada PR) y el despliegue (al hacer merge), que no
# siguen si fallan. Solas se lanzan a mano: Actions → Pruebas → Run workflow.
name: Pruebas

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  # con el nombre del workflow que llama, para que el E2E y el despliegue no cancelen esta corrida ni al revés
  group: pruebas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas del sistema
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: despliegue/requirements.txt

      - name: Instalar
        timeout-minutes: 10
        run: |
          # torch para CPU: el de CUDA pesa ~2 GB y aquí no hay GPU
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r despliegue/requirements.txt pytest==9.1.1

      - name: Correr las pruebas
        run: pytest -v --color=yes tests
